name: Linux cross release builds

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run target smoke tests after building
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cross:
    name: Linux ${{ matrix.target }} (musl ${{ matrix.linkage }} cross)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [mips, mipsel, mips64, riscv64, armv5]
        linkage: [static, dynamic]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - name: Check JavaScript types
        if: inputs.run-tests
        run: pnpm run type-check
      - name: Bundle JavaScript on the host
        run: pnpm run bundle:min
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools and target emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            zip unzip tar xz-utils autoconf automake libtool perl bison flex \
            qemu-user
      - name: Cache verified cross toolchain downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cno-toolchains/*-cross.tgz
          key: musl-cross-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/ci/musl-toolchains.sha512') }}
      - name: Cross-compile and package runtime and OXC
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
          CNO_RUN_TESTS: ${{ inputs.run-tests }}
          CNO_STATIC_LINK: ${{ matrix.linkage == 'static' && 'true' || 'false' }}
        run: bash scripts/ci/build-cross-linux.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cno-linux-musl-${{ matrix.linkage }}-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
