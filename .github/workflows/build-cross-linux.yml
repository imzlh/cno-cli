name: Linux cross release builds

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cross:
    name: Linux ${{ matrix.target }} (musl cross)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [mips, mipsel, mips64, riscv64, armv5]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - name: Check and bundle JavaScript on the host
        run: |
          pnpm run type-check
          pnpm run bundle
      - name: Install build tools and target emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            zip unzip tar xz-utils autoconf automake libtool perl bison flex \
            qemu-user
      - name: Cross-compile static runtime and run target smoke checks
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: bash scripts/ci/build-cross-linux.sh '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cno-linux-musl-${{ matrix.target }}
          path: artifacts/cno-linux-musl-${{ matrix.target }}.tar.gz
          if-no-files-found: error
