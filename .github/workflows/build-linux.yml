name: Linux release builds

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run type checks and staged runtime smoke tests.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.target }} (${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {libc: glibc, target: x86_64, platform: linux/amd64, image: 'debian:bookworm-slim', runner: ubuntu-24.04}
          - {libc: glibc, target: i386, platform: linux/386, image: 'debian:bookworm-slim', runner: ubuntu-24.04}
          - {libc: glibc, target: arm64, platform: linux/arm64, image: 'debian:bookworm-slim', runner: ubuntu-24.04-arm}
          - {libc: glibc, target: armv7, platform: linux/arm/v7, image: 'debian:bookworm-slim', runner: ubuntu-24.04-arm}
          # The official Debian index omits armel. Its architecture-specific
          # image is still available; ARMv5 soft-float libraries run on ARMv6.
          - {libc: glibc, target: armv6, platform: linux/arm/v5, image: 'arm32v5/debian:bookworm-slim', runner: ubuntu-24.04-arm}
          # Smaller executable with replaceable shared dependencies in lib/.
          # Keep the same glibc baseline and CPU ABI as the standard archives.
          - {libc: glibc-minimal, target: x86_64, platform: linux/amd64, image: 'debian:bookworm-slim', runner: ubuntu-24.04}
          - {libc: glibc-minimal, target: i386, platform: linux/386, image: 'debian:bookworm-slim', runner: ubuntu-24.04}
          - {libc: glibc-minimal, target: arm64, platform: linux/arm64, image: 'debian:bookworm-slim', runner: ubuntu-24.04-arm}
          - {libc: glibc-minimal, target: armv7, platform: linux/arm/v7, image: 'debian:bookworm-slim', runner: ubuntu-24.04-arm}
          - {libc: glibc-minimal, target: armv6, platform: linux/arm/v5, image: 'arm32v5/debian:bookworm-slim', runner: ubuntu-24.04-arm}
          - {libc: musl, target: x86_64, platform: linux/amd64, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl, target: i386, platform: linux/386, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl, target: arm64, platform: linux/arm64, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl, target: armv7, platform: linux/arm/v7, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl, target: armv6, platform: linux/arm/v6, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          # Dynamic musl builds for musl-based systems (Alpine, OpenWrt) where
          # native module loading and a smaller binary matter more than portability.
          - {libc: musl-dynamic, target: x86_64, platform: linux/amd64, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl-dynamic, target: i386, platform: linux/386, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl-dynamic, target: arm64, platform: linux/arm64, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl-dynamic, target: armv7, platform: linux/arm/v7, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl-dynamic, target: armv6, platform: linux/arm/v6, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - name: Check JavaScript on the host
        if: inputs.run-tests
        run: pnpm run type-check
      - name: Check Linux dependency staging
        if: inputs.run-tests
        run: node --test tests/ci/*.test.mjs
      - name: Bundle JavaScript on the host
        run: pnpm run bundle:min
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache OXC Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build-oxc-rust/cargo
          # Variants of each libc share their PIC Rust archive. Cargo still
          # checks source fingerprints after a partial-key cache restore.
          key: rust-linux-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ startsWith(matrix.libc, 'glibc') && 'glibc' || 'musl' }}-${{ hashFiles('.cargo/config.toml', 'scripts/ci/oxc/**', 'scripts/ci/oxc/build-linux.sh', 'ext-oxc/Cargo.toml', 'ext-oxc/src/**/*.rs') }}
          restore-keys: |
            rust-linux-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ startsWith(matrix.libc, 'glibc') && 'glibc' || 'musl' }}-
      - name: Compile OXC Rust archive on the host
        env:
          LIBC: ${{ startsWith(matrix.libc, 'glibc') && 'glibc' || 'musl' }}
          TARGET: ${{ matrix.target }}
        run: sh scripts/ci/oxc/build-linux.sh --prepare "$LIBC" "$TARGET" build-oxc-rust
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,386
      - name: Build inside the target platform
        env:
          LIBC: ${{ matrix.libc }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
          RUN_TESTS: ${{ inputs.run-tests }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v "$RUNNER_TEMP/cno-smoke-cache:/cache" \
            -e CTS_CACHE_DIR=/cache -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            -e CNO_OXC_RUST_ARCHIVE=/work/build-oxc-rust/libcjs_oxc_core.a \
            "$IMAGE" sh scripts/ci/linux/build.sh "$LIBC" "$TARGET" "$RUN_TESTS"
      - uses: actions/upload-artifact@v4
        with:
          name: cno-linux-${{ matrix.libc }}-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  cross:
    name: Linux ${{ matrix.target }} (musl ${{ matrix.linkage }} cross)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: [mips, mipsel, mips64, riscv64, armv5]
        linkage: [static, dynamic]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - name: Check JavaScript types
        if: inputs.run-tests
        run: pnpm run type-check
      - name: Check Linux dependency staging and QEMU runtime preparation
        if: inputs.run-tests
        run: node --test tests/ci/*.test.mjs
      - name: Bundle JavaScript on the host
        run: pnpm run bundle:min
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools and target emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            zip unzip tar xz-utils autoconf automake libtool perl bison flex \
            qemu-user
      - name: Cache verified cross toolchain downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cno-toolchains/*-cross.tgz
          key: musl-cross-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/ci/linux/musl-toolchains.sha512') }}
      - name: Cache cross-compiled native dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cno-vcpkg-binaries
          key: vcpkg-cross-v1-${{ matrix.target }}-${{ matrix.linkage }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*musl*.cmake', 'cmake/toolchains/musl-cross.cmake', 'scripts/ci/linux/musl-toolchains.sha512') }}
          restore-keys: |
            vcpkg-cross-v1-${{ matrix.target }}-${{ matrix.linkage }}-
      - name: Cache OXC Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build-cross-${{ matrix.target }}/oxc/rust/cargo
          key: rust-cross-v1-${{ matrix.target }}-${{ hashFiles('.cargo/config.toml', 'scripts/ci/oxc/**', 'scripts/ci/oxc/build-linux.sh', 'ext-oxc/Cargo.toml', 'ext-oxc/src/**/*.rs') }}
          restore-keys: |
            rust-cross-v1-${{ matrix.target }}-
      - name: Create native dependency cache directory
        run: mkdir -p "$RUNNER_TEMP/cno-vcpkg-binaries"
      - name: Cross-compile and package runtime and OXC
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/cno-vcpkg-binaries,readwrite
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
          CNO_RUN_TESTS: ${{ inputs.run-tests }}
          CNO_STATIC_LINK: ${{ matrix.linkage == 'static' && 'true' || 'false' }}
        run: bash scripts/ci/linux/cross.sh '${{ matrix.target }}'
      - name: Upload cross build failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-linux-musl-${{ matrix.linkage }}-${{ matrix.target }}
          path: |
            build-cross-${{ matrix.target }}/vcpkg/buildtrees/**/*.log
            build-cross-${{ matrix.target }}/**/CMakeConfigureLog.yaml
            build-cross-${{ matrix.target }}/**/vcpkg-manifest-install.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cno-linux-musl-${{ matrix.linkage }}-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
