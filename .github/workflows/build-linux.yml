name: Linux release builds

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run type checks and staged runtime smoke tests.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.target }} (${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {libc: glibc, target: x86_64, platform: linux/amd64, image: 'debian:bookworm-slim', runner: ubuntu-24.04}
          - {libc: glibc, target: i386, platform: linux/386, image: 'debian:bookworm-slim', runner: ubuntu-24.04}
          - {libc: glibc, target: arm64, platform: linux/arm64, image: 'debian:bookworm-slim', runner: ubuntu-24.04-arm}
          - {libc: glibc, target: armv7, platform: linux/arm/v7, image: 'debian:bookworm-slim', runner: ubuntu-24.04-arm}
          # The official Debian index omits armel. Its architecture-specific
          # image is still available; ARMv5 soft-float libraries run on ARMv6.
          - {libc: glibc, target: armv6, platform: linux/arm/v5, image: 'arm32v5/debian:bookworm-slim', runner: ubuntu-24.04-arm}
          - {libc: musl, target: x86_64, platform: linux/amd64, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl, target: i386, platform: linux/386, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl, target: arm64, platform: linux/arm64, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl, target: armv7, platform: linux/arm/v7, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl, target: armv6, platform: linux/arm/v6, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          # Dynamic musl builds for musl-based systems (Alpine, OpenWrt) where
          # native module loading and a smaller binary matter more than portability.
          - {libc: musl-dynamic, target: x86_64, platform: linux/amd64, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl-dynamic, target: i386, platform: linux/386, image: 'alpine:3.21', runner: ubuntu-24.04}
          - {libc: musl-dynamic, target: arm64, platform: linux/arm64, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl-dynamic, target: armv7, platform: linux/arm/v7, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
          - {libc: musl-dynamic, target: armv6, platform: linux/arm/v6, image: 'alpine:3.21', runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - name: Check JavaScript on the host
        if: inputs.run-tests
        run: pnpm run type-check
      - name: Bundle JavaScript on the host
        run: pnpm run bundle:min
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache OXC Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build-oxc-rust/cargo
          # Static and dynamic musl use the same PIC Rust archive. Cargo still
          # checks source fingerprints after a partial-key cache restore.
          key: rust-linux-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.libc == 'glibc' && 'glibc' || 'musl' }}-${{ hashFiles('.cargo/config.toml', 'scripts/ci/oxc/**', 'scripts/ci/build-oxc-linux.sh', 'ext-oxc/Cargo.toml', 'ext-oxc/src/**/*.rs') }}
          restore-keys: |
            rust-linux-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.libc == 'glibc' && 'glibc' || 'musl' }}-
      - name: Compile OXC Rust archive on the host
        env:
          LIBC: ${{ matrix.libc == 'glibc' && 'glibc' || 'musl' }}
          TARGET: ${{ matrix.target }}
        run: sh scripts/ci/build-oxc-linux.sh --prepare "$LIBC" "$TARGET" build-oxc-rust
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64,386
      - name: Build inside the target platform
        env:
          LIBC: ${{ matrix.libc }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
          RUN_TESTS: ${{ inputs.run-tests }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v "$RUNNER_TEMP/cno-smoke-cache:/cache" \
            -e CTS_CACHE_DIR=/cache -e CMAKE_BUILD_PARALLEL_LEVEL=4 \
            -e CNO_OXC_RUST_ARCHIVE=/work/build-oxc-rust/libcjs_oxc_core.a \
            "$IMAGE" sh scripts/ci/build-linux.sh "$LIBC" "$TARGET" "$RUN_TESTS"
      - uses: actions/upload-artifact@v4
        with:
          name: cno-linux-${{ matrix.libc }}-${{ matrix.target }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
