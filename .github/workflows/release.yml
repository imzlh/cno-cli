name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      run-tests: false
      native-matrix: >-
        [{"target":"macos-x86_64","runner":"macos-15-intel"},
         {"target":"macos-arm64","runner":"macos-15"},
         {"target":"windows-x64","runner":"windows-2022"},
         {"target":"windows-arm64","runner":"windows-11-arm"}]

  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      run-tests: false

  linux-cross:
    uses: ./.github/workflows/build-cross-linux.yml
    with:
      run-tests: false

  release:
    name: Publish release
    needs: [build, linux, linux-cross]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cno-*
          merge-multiple: true
      - name: Verify complete release archive set
        run: sh scripts/ci/verify-release-artifacts.sh artifacts
      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
