name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      all-linux-targets:
        description: Also build and test every Linux release architecture
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  linux:
    if: inputs.all-linux-targets == true
    uses: ./.github/workflows/build-linux.yml

  linux-cross:
    if: inputs.all-linux-targets == true
    uses: ./.github/workflows/build-cross-linux.yml
