name: Build and test

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run type checks and full runtime tests; protocol smoke tests always run.
        type: boolean
        default: true
      native-matrix:
        description: Native runner builds; releases build Linux in the dedicated matrix.
        type: string
        default: >-
          [{"target":"linux-x86_64","runner":"ubuntu-24.04"},
           {"target":"linux-arm64","runner":"ubuntu-24.04-arm"},
           {"target":"macos-x86_64","runner":"macos-15-intel"},
           {"target":"macos-arm64","runner":"macos-15"},
           {"target":"windows-x64","runner":"windows-2022"},
           {"target":"windows-arm64","runner":"windows-11-arm"}]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - if: inputs.run-tests
        run: pnpm run type-check
      - if: inputs.run-tests
        run: node --test tests/ci/*.test.mjs tests/bun/semver-unit.test.mjs tests/cts/cli-startup-loading.test.mjs tests/cts/setup-polyfill.test.mjs tests/cts/cli-lifecycle.test.mjs tests/node/util-source.test.mjs
      - run: pnpm run bundle:min

  native:
    name: ${{ matrix.target }}
    needs: javascript
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.native-matrix) }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-js

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libcurl4-openssl-dev libltdl-dev libffi-dev libsqlite3-dev \
            libssl-dev zlib1g-dev libexpat1-dev libbrotli-dev libnghttp2-dev

      - uses: ./.github/actions/setup-macos
        if: runner.os == 'macOS'

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}

      - name: Configure Rust MSVC linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command cl.exe -ErrorAction Stop).Source
          $linker = Join-Path (Split-Path $compiler) 'link.exe'
          if (-not (Test-Path $linker)) { throw "MSVC linker not found beside $compiler" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV

      - name: Configure Windows dependency cache
        if: runner.os == 'Windows'
        id: windows-deps
        shell: pwsh
        run: |
          $cacheDirectory = Join-Path $env:RUNNER_TEMP 'cno-vcpkg-binaries'
          New-Item -ItemType Directory -Force $cacheDirectory | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cacheDirectory,readwrite" >> $env:GITHUB_ENV
          $sdk = $env:WindowsSDKVersion -replace '[\\/]+$', ''
          "toolchain=$env:VCToolsVersion-$sdk" >> $env:GITHUB_OUTPUT

      - name: Restore Windows native dependencies
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          # Cache compiled packages, not the vcpkg checkout or CMake state.
          # vcpkg verifies each restored package's ABI before installing it.
          path: ${{ runner.temp }}/cno-vcpkg-binaries
          key: vcpkg-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.windows-deps.outputs.toolchain }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-toolchain.cmake', 'cmake/triplets/*windows*.cmake') }}
          restore-keys: |
            vcpkg-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.windows-deps.outputs.toolchain }}-
            vcpkg-v1-${{ matrix.runner }}-${{ matrix.target }}-

      - uses: lukka/run-vcpkg@v11
        if: runner.os == 'Windows'
        with:
          # vcpkg 2026.07.29 pairs schema 2 with a compatible tool executable.
          # Keep this in sync with vcpkg.json's builtin-baseline.
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
          vcpkgJsonGlob: 'vcpkg.json'

      - uses: dtolnay/rust-toolchain@stable
        id: rust

      - name: Cache OXC Rust dependencies
        uses: actions/cache@v4
        with:
          # Corrosion uses --target-dir below this directory, not ext-oxc/target.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/oxc-ci/cargo
          key: rust-native-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ steps.windows-deps.outputs.toolchain }}-${{ hashFiles('.cargo/config.toml', 'scripts/ci/oxc/Cargo.lock', 'scripts/ci/oxc/CMakeLists.txt', 'scripts/ci/oxc/vendor/**', 'ext-oxc/Cargo.toml', 'ext-oxc/src/**/*.rs', 'scripts/ci/build.mjs') }}
          restore-keys: |
            rust-native-v1-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ steps.windows-deps.outputs.toolchain }}-

      - name: Build cno and OXC
        id: native-build
        shell: bash
        run: node scripts/ci/build.mjs 2>&1 | tee native-build.log

      - name: Report native build diagnostics
        if: failure() && steps.native-build.outcome == 'failure'
        run: node scripts/ci/report-build-errors.mjs native-build.log

      - name: Build native FFI test fixture
        if: inputs.run-tests
        run: cmake --build build --config Release --target ffi_fixture

      - name: Upload native test fixtures
        if: inputs.run-tests
        uses: actions/upload-artifact@v4
        with:
          name: cno-test-fixtures-${{ matrix.target }}
          path: |
            build/circu.js/libffi_fixture.so
            build/circu.js/libffi_fixture.dylib
            build/circu.js/ffi_fixture.dll
          if-no-files-found: error

      - name: Check cycle guards and packing against the staged runtime
        if: inputs.run-tests
        shell: bash
        run: node --test tests/cts/module-id-cycle-guard.test.mjs tests/cts/pack-command.test.mjs 2>&1 | tee cycle-pack.log

      - name: Check native protocol runtime ownership
        shell: bash
        run: |
          cmake --build build --config Release --target protocol_runtime_test 2>&1 | tee protocol-build.log
          ctest --test-dir build -C Release -R '^protocol_runtime_test$' --output-on-failure 2>&1 | tee protocol-test.log

      - name: Check HTTP/2 interoperability with Node.js
        shell: bash
        env:
          CNO_TEST_BINARY: ${{ runner.os == 'Windows' && 'build/stage/cno.exe' || 'build/stage/cno' }}
        run: node --test tests/node/http2-interop.test.mjs 2>&1 | tee http2-interop.log

      - name: Save Windows native dependencies
        if: always() && !cancelled() && runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cno-vcpkg-binaries
          # Preserve completed packages if a later compiler/OXC step fails.
          # A partial save must not occupy the immutable complete cache key.
          key: ${{ steps.native-build.outcome == 'success' && steps.vcpkg-cache.outputs.cache-primary-key || format('{0}-partial-{1}-{2}', steps.vcpkg-cache.outputs.cache-primary-key, github.run_id, github.run_attempt) }}

      - name: Smoke test staged runtime
        if: inputs.run-tests
        shell: bash
        env:
          CTS_CACHE_DIR: ${{ runner.temp }}/cno-smoke-cache
        run: node scripts/ci/smoke.mjs build/stage 2>&1 | tee smoke.log

      - name: Smoke test built-in protocols
        if: ${{ !inputs.run-tests }}
        shell: bash
        env:
          CTS_CACHE_DIR: ${{ runner.temp }}/cno-smoke-cache
        run: node scripts/ci/smoke.mjs build/stage --protocols-only 2>&1 | tee smoke.log

      - name: Package
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/cno-$TARGET.tar.gz" -C build/stage --exclude='.dlls.stamp' .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path build/stage/cno.exe, build/stage/*.dll, build/stage/ext -DestinationPath "artifacts/cno-$env:TARGET.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cno-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: '*.log'
          if-no-files-found: ignore

  test:
    name: test ${{ matrix.target }}
    needs: native
    if: inputs.run-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.native-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/setup-macos
        if: runner.os == 'macOS'
      - uses: actions/download-artifact@v4
        with:
          name: cno-${{ matrix.target }}
          path: build/stage
      - uses: actions/download-artifact@v4
        with:
          name: cno-test-fixtures-${{ matrix.target }}
          path: build/circu.js
      - name: Unpack staged runtime
        if: runner.os != 'Windows'
        run: tar -xzf "build/stage/cno-${{ matrix.target }}.tar.gz" -C build/stage
      - name: Unpack staged runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "build/stage/cno-${{ matrix.target }}.zip" -DestinationPath build/stage -Force
      - name: Run runtime test suite
        shell: bash
        env:
          CTS_CACHE_DIR: ${{ runner.temp }}/cno-test-cache
        run: node scripts/ci/run-tests.mjs --stage=build/stage --shards=core,node,web,compat 2>&1 | tee runtime-tests.log

      - name: Upload failure diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-test-${{ matrix.target }}
          path: '*.log'
          if-no-files-found: ignore
