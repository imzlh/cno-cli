name: Build and test

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run type checks and staged runtime smoke tests.
        type: boolean
        default: true
      native-matrix:
        description: Native runner builds; releases build Linux in the dedicated matrix.
        type: string
        default: >-
          [{"target":"linux-x86_64","runner":"ubuntu-24.04"},
           {"target":"linux-arm64","runner":"ubuntu-24.04-arm"},
           {"target":"macos-x86_64","runner":"macos-15-intel"},
           {"target":"macos-arm64","runner":"macos-15"},
           {"target":"windows-x64","runner":"windows-2022"},
           {"target":"windows-arm64","runner":"windows-11-arm"}]

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-js
      - if: inputs.run-tests
        run: pnpm run type-check
      - run: pnpm run bundle

  native:
    name: ${{ matrix.target }}
    needs: javascript
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.native-matrix) }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-js

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libcurl4-openssl-dev libltdl-dev libffi-dev libsqlite3-dev \
            libssl-dev zlib1g-dev libexpat1-dev libbrotli-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkgconf libffi sqlite openssl@3 zlib expat curl brotli
          prefixes="$(brew --prefix)"
          for formula in libffi sqlite openssl@3 zlib expat curl brotli; do
            prefixes="$prefixes;$(brew --prefix "$formula")"
          done
          printf 'CNO_CMAKE_PREFIX_PATH=%s\n' "$prefixes" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.target == 'windows-arm64' && 'arm64' || 'x64' }}

      - uses: lukka/run-vcpkg@v11
        if: runner.os == 'Windows'
        with:
          # vcpkg 2026.07.29 pairs schema 2 with a compatible tool executable.
          # Keep this in sync with vcpkg.json's builtin-baseline.
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
          vcpkgJsonGlob: 'vcpkg.json'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build cno and OXC
        run: node scripts/ci/build.mjs

      - name: Smoke test staged runtime
        if: inputs.run-tests
        env:
          CTS_CACHE_DIR: ${{ runner.temp }}/cno-smoke-cache
        run: node scripts/ci/smoke.mjs build/stage

      - name: Package
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/cno-$TARGET.tar.gz" -C build/stage --exclude='.dlls.stamp' .

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path build/stage/cno.exe, build/stage/*.dll, build/stage/ext -DestinationPath "artifacts/cno-$env:TARGET.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cno-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
